<style>
:root{
  --g:#0E5C3B;--g2:#13744B;--g3:#E7F2EB;--o:#F28C1E;--o2:#D9700A;--o3:#FFF1E0;
  --cream:#FBF7F0;--card:#FFFFFF;--ink:#13261D;--ink2:#3C4B43;--mut:#6B7A71;--line:#E3E8E2;
  --r:18px;--sh:0 6px 18px rgba(14,92,59,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--cream);font-size:16px;line-height:1.45;padding-bottom:90px;font-weight:500}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
/* верх */
.top{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 1px 0 var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none}
.logo svg{width:40px;height:34px;flex:0 0 auto}
.logo b{display:block;font-weight:800;font-size:20px;line-height:1;color:var(--g);letter-spacing:-.01em}
.logo small{display:block;font-weight:700;font-size:8.5px;letter-spacing:.06em;color:var(--o);margin-top:3px}
.lang{display:flex;background:var(--g3);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;font:700 12px Montserrat,sans-serif;padding:6px 10px;color:var(--g);cursor:pointer;border-radius:999px}
.lang button[aria-pressed=true]{background:var(--g);color:#fff}
.demo{background:var(--o3);color:#7A3E00;font-size:12px;font-weight:700;text-align:center;padding:6px 12px}
/* первый экран */
.hero{background:var(--g);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-90px;top:-70px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero .wrap{position:relative;z-index:1;padding-top:26px;padding-bottom:28px}
.place{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#CFE7D9;margin-bottom:12px}
h1{font-size:clamp(28px,7.6vw,44px);line-height:1.06;margin:0 0 14px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--o)}
.lead-in{font-size:16px;color:#E3F0E8;margin:0 0 18px;max-width:560px}
.free{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);color:#FFD7AD;font-weight:800;border-radius:10px;padding:7px 12px;font-size:14px;margin-bottom:18px}
.ctas{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:800 15px Montserrat,sans-serif;border:0;border-radius:14px;padding:14px 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--g);background:#fff;transition:transform .1s,filter .1s}
.btn:active{transform:scale(.98)}
.btn.o{background:var(--o);color:#fff}
.btn.g{background:var(--g);color:#fff}
.btn.line{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.btn.small{font-size:13px;padding:10px 13px;border-radius:12px}
/* возраст */
.ages{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-top:-14px;position:relative;z-index:2}
.q{font-weight:800;margin:0 0 10px;font-size:16px}
.path{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.path::-webkit-scrollbar{height:0}
.step{scroll-snap-align:start;flex:0 0 auto;min-width:92px;border:2px solid var(--line);border-radius:14px;background:#fff;padding:9px 12px;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.step b{display:block;font-size:17px;font-weight:900;color:var(--g)}
.step small{color:var(--mut);font-size:12px;font-weight:600}
.step[aria-pressed=true]{border-color:var(--o);background:var(--o3)}
/* секции */
section{padding:28px 0 4px;scroll-margin-top:68px}
h2{font-size:24px;margin:0 0 6px;font-weight:900;text-transform:uppercase;color:var(--g);letter-spacing:-.01em}
h2 em{font-style:normal;color:var(--o)}
.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.filter{display:flex;align-items:center;gap:8px;margin:-6px 0 14px;font-size:14px;color:var(--ink2);font-weight:700}
.filter[hidden]{display:none}
.filter button{border:0;background:var(--g);color:#fff;border-radius:999px;font:700 12px Montserrat,sans-serif;padding:5px 11px;cursor:pointer}
.progs{display:grid;gap:12px}
@media(min-width:620px){.progs{grid-template-columns:1fr 1fr}}
.prog{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:8px;border-top:5px solid var(--c,var(--g))}
.prog .hd{display:flex;gap:10px;align-items:flex-start}
.prog .ic{width:42px;height:42px;border-radius:12px;background:var(--g3);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.prog h3{margin:0;font-size:17px;line-height:1.2;font-weight:800;color:var(--ink)}
.prog .tag{font-size:12px;font-weight:700;color:var(--mut)}
.prog ul{margin:2px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.prog li{font-size:12px;font-weight:700;background:var(--g3);color:var(--g);border-radius:999px;padding:4px 9px}
.prog .note{font-size:12.5px;color:var(--o2);font-weight:700}
.prog .row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:auto;padding-top:6px}
.prog .price{font-size:22px;font-weight:900;color:var(--g)}
.prog .price small{font-size:13px;font-weight:700;color:var(--mut)}
.prog .price.ask{font-size:14px;color:var(--o2)}
.extra > h3{font-size:15px;margin:22px 0 10px;color:var(--ink2);font-weight:800;text-transform:uppercase}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:620px){.minis{grid-template-columns:repeat(4,1fr)}}
.mini{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;border:0;font:inherit;color:var(--ink);cursor:pointer}
.mini .ic{font-size:22px}
.mini b{font-size:15px;font-weight:800}
.mini small{font-size:12px;font-weight:700;color:var(--o2)}
/* доверие */
.vals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:620px){.vals{grid-template-columns:repeat(4,1fr)}}
.val{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:14px;font-weight:800;font-size:14px;color:var(--g)}
.val i{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--o3);font-style:normal;font-size:19px;margin-bottom:8px}
.wins{display:grid;gap:10px;margin-top:14px}
.win{display:flex;gap:12px;align-items:center;background:var(--g);color:#fff;border-radius:16px;padding:13px 15px}
.win span{font-size:26px}
.win b{display:block;font-weight:900;font-size:15px}
.win small{color:#CFE7D9;font-size:13px;font-weight:600}
/* заявка */
.offer{background:var(--g);color:#fff;border-radius:24px;padding:22px 18px;margin:6px 0;position:relative;overflow:hidden}
.offer::before{content:"";position:absolute;left:-60px;bottom:-80px;width:200px;height:200px;border-radius:50%;background:rgba(242,140,30,.18)}
.offer > *{position:relative}
.offer h2{color:#fff;font-size:26px}
.offer .sub{color:#CFE7D9}
.badge{display:inline-block;background:var(--o);color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:5px 12px;margin-bottom:10px}
.quizres{display:none;background:rgba(255,255,255,.1);border-radius:14px;padding:11px 13px;margin-bottom:12px;font-size:14px}
.quizres.on{display:block}
form .f{margin-bottom:12px}
form label.t,.t{display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:#DDEDE3}
form input[type=text],form input[type=tel],form select{width:100%;font:600 16px Montserrat,sans-serif;padding:12px;border-radius:12px;border:2px solid #fff;background:#fff;color:var(--ink)}
form input:focus,form select:focus{outline:3px solid var(--o);outline-offset:1px}
.two{display:grid;gap:0 12px}@media(min-width:560px){.two{grid-template-columns:1fr 1fr}}
.seg{display:flex;gap:8px}
.seg label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:2px solid rgba(255,255,255,.45);border-radius:12px;padding:10px;cursor:pointer;font-weight:700;font-size:15px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label.on{background:#fff;color:var(--g);border-color:#fff}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#DDEDE3;margin:4px 0 14px}
.consent input{width:20px;height:20px;margin-top:1px;flex:0 0 auto;accent-color:var(--o)}
.consent button{background:none;border:0;color:#FFC98F;text-decoration:underline;font:inherit;padding:0;cursor:pointer}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.ferr{color:#FFC4A0;font-size:13px;margin-top:5px;display:none;font-weight:600}.f.bad .ferr{display:block}.f.bad input,.f.bad select{border-color:#FF9A6B}
.send{width:100%;font-size:16px}
.done{display:none}.done.on{display:block}
.done h3{font-size:24px;margin:0 0 8px;font-weight:900}
.waline{display:inline-flex;align-items:center;gap:8px;margin-top:12px;background:#25D366;color:#073B1E;border-radius:12px;padding:11px 14px;font-weight:800;text-decoration:none}
/* контакты */
.contact{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px;display:grid;gap:10px}
.contact .ln{display:flex;gap:10px;align-items:flex-start;font-weight:700}
.contact .ln span{width:26px;text-align:center}
.contact .ln a{color:var(--g)}
.contact .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.contact .btn{box-shadow:inset 0 0 0 2px var(--g3)}
footer{padding:22px 0 30px;color:var(--mut);font-size:13px}
/* нижняя панель */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;box-shadow:0 -1px 0 var(--line),0 -6px 18px rgba(0,0,0,.05);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dock .wrap{display:flex;gap:10px;padding:0}
.dock .btn{flex:1;padding:13px 10px}
.dock .wa{flex:0 0 56px;background:#25D366;color:#fff;font-size:22px}
.dock .wa[hidden]{display:none}
.dock::after{content:"";position:absolute;left:0;right:0;top:100%;height:100vh;background:#fff}
/* тест */
.sheet-bg{position:fixed;inset:0;background:rgba(19,38,29,.5);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--cream);border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .25s ease;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}.sheet-bg.on{display:block}
.sheet .wrap{padding:0;max-width:640px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--g)}
.x{width:38px;height:38px;border-radius:50%;border:0;background:#fff;box-shadow:var(--sh);font-size:17px;cursor:pointer;color:var(--ink)}
.bar{height:8px;border-radius:999px;background:#fff;overflow:hidden;margin-bottom:16px;box-shadow:inset 0 0 0 1px var(--line)}.bar i{display:block;height:100%;background:var(--o);width:20%;transition:width .2s}
.qn{font-size:12px;font-weight:800;color:var(--o2);text-transform:uppercase;margin:0 0 4px}
.qq{font-size:21px;font-weight:800;margin:0 0 14px;line-height:1.25}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:700 16px Montserrat,sans-serif;border:2px solid var(--line);border-radius:14px;background:#fff;padding:14px;cursor:pointer;color:var(--ink);display:flex;gap:10px;align-items:center}
.opt:active{border-color:var(--o)}
.opt .e{font-size:20px;width:28px;text-align:center}
.yn{grid-template-columns:repeat(3,1fr)}
.yn .opt{justify-content:center;flex-direction:column;gap:4px;font-size:14px;text-align:center}
.back{margin-top:12px;background:none;border:0;font:700 14px Montserrat,sans-serif;color:var(--mut);cursor:pointer;padding:6px 0}
.score{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.score b{font-size:34px;font-weight:900;color:var(--g)}
.score p{margin:6px 0 0;font-size:14px;color:var(--ink2)}
.score .hint{font-size:12px;color:var(--mut);margin-top:8px}
.res .prog{margin-bottom:10px}
/* подсказка */
.nudge{position:fixed;left:16px;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:35;max-width:520px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:12px 12px 12px 14px;display:none;align-items:center;gap:10px;border-left:5px solid var(--o)}
.nudge.on{display:flex;animation:up .3s ease}
.nudge p{margin:0;flex:1;font-size:14px;font-weight:700}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
dialog{border:0;border-radius:18px;max-width:520px;padding:18px;color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(19,38,29,.5)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

    if (!state.quizProg) { box.classList.remove('on'); return; }
    if (state.stage) { parts.push(stageName(state.stage)); }
    if (state.score >= 0) { parts.push(t('scoreTitle')(state.score, state.max)); }
    if (goalText(lang)) { parts.push(goalText(lang)); }
    parts.push(progLabel(state.quizProg, lang));
    box.innerHTML = t('quizRes')(esc(parts.join(' · ')));
    box.classList.add('on');
  }
  document.querySelectorAll('[data-open-quiz]').forEach(function (b) { b.addEventListener('click', openQuiz); });
  document.getElementById('sheetX').addEventListener('click', closeQuiz);
  bg.addEventListener('click', closeQuiz);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheet.classList.contains('on')) { closeQuiz(); } });

  // ---------- мягкая подсказка: один раз за визит ----------
  var nudge = document.getElementById('nudge'), nudgeShown = sget('sessionStorage', 'ep-nudge') === '1';
  function canNudge() { return !nudgeShown && sget('sessionStorage', 'ep-quiz') !== '1' && sget('sessionStorage', 'ep-lead') !== '1' && !sheet.classList.contains('on'); }
  function showNudge() { if (!canNudge()) { return; } nudgeShown = true; sset('sessionStorage', 'ep-nudge', '1'); nudge.classList.add('on'); }
  function hideNudge(keep) { nudge.classList.remove('on'); if (!keep) { nudgeShown = true; sset('sessionStorage', 'ep-nudge', '1'); } }
  document.getElementById('nudgeX').addEventListener('click', function () { hideNudge(); });
  setTimeout(showNudge, 40000);
  window.addEventListener('scroll', function () {
    var h = document.documentElement.scrollHeight - innerHeight;
    if (h > 0 && scrollY / h > 0.6) { showNudge(); }
  }, { passive: true });

  // ---------- политика, язык ----------
  document.getElementById('policyBtn').addEventListener('click', function () {
    var d = document.getElementById('policy'); if (d.showModal) { d.showModal(); }
  });
  document.querySelectorAll('.lang button').forEach(function (b) {
    b.addEventListener('click', function () { lang = b.getAttribute('data-lang'); sset('localStorage', 'ep-lang', lang); applyLang(); });
  });

  applyLang();
  track('visit', '');
})();
</script>
</body>
</html>
